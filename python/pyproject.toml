[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consent-remote-support"
version = "0.1.0"
description = "Consent-based, read-only remote support over pinned TLS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
]

[project.scripts]
remote-support = "remote_support.cli:main"

[tool.setuptools.packages.find]
where = ["."]
