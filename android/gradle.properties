# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# This app uses no AndroidX libraries, so the Jetifier stays off.
android.useAndroidX=false
android.nonTransitiveRClass=true

# Where the WebView points when the app starts.
#
#   "" (empty, the default) -> load the offline copy of the site bundled in
#                              app/src/main/assets/www
#   "https://example.com"    -> load a live deployment instead
#
# Override per build with:  ./gradlew assembleDebug -PsiteUrl=https://example.com
siteUrl=
